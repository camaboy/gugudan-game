<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>구구단 챌린지</title>
<style>
:root{
  --bg1:#fff8e8; --bg2:#eaf6ff; --card:#fff; --text:#24324a; --muted:#6f7b91;
  --accent:#5aa9ff; --good:#28b477; --bad:#ee5b5b; --line:#e8edf5;
  --shadow:0 14px 40px rgba(55,76,110,.12);
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh;
  font-family:system-ui,-apple-system,"Pretendard","Noto Sans KR",Arial,sans-serif;
  color:var(--text); background:linear-gradient(135deg,var(--bg1),var(--bg2));
}
button{font:inherit;cursor:pointer}
.wrap{width:min(980px,92vw);margin:0 auto;padding:28px 0 44px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
.brand{font-weight:1000;font-size:clamp(25px,5vw,39px);letter-spacing:-.04em}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.sound{border:0;background:#fff;border-radius:14px;padding:10px 13px;box-shadow:var(--shadow)}
.panel{
  background:rgba(255,255,255,.93);border:1px solid rgba(255,255,255,.7);
  border-radius:24px;padding:22px;box-shadow:var(--shadow)
}
.hidden{display:none!important}
.stage-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.stage{
  border:1px solid var(--line);background:#fff;border-radius:20px;padding:18px;
  text-align:left;transition:.18s ease;min-height:150px
}
.stage:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(45,68,100,.10)}
.num{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:1000;margin-bottom:12px}
.stage:nth-child(1) .num{background:#f7a44c}
.stage:nth-child(2) .num{background:#8b7cf6}
.stage:nth-child(3) .num{background:#36b98a}
.stage:nth-child(4) .num{background:#ff7a73}
.stage h3{margin:0 0 7px;font-size:20px}
.stage p{margin:0;color:var(--muted);line-height:1.5}
.game-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
.back{border:0;background:#f2f5fa;color:var(--text);padding:10px 14px;border-radius:13px;font-weight:900}
.status{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{background:#f5f7fb;border:1px solid var(--line);padding:8px 11px;border-radius:999px;font-size:13px;font-weight:900}
.title{text-align:center;margin:8px 0 18px}
.title h2{margin:0 0 6px;font-size:clamp(24px,5vw,34px)}
.title p{margin:0;color:var(--muted)}
.footer-note,.hint{text-align:center;color:var(--muted);font-size:13px;margin-top:12px}

/* 공부 화면 */
.study-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.table-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}
.table-card h3{margin:0 0 10px;text-align:center;font-size:22px}
.eq{padding:6px 8px;border-radius:9px;text-align:center;font-weight:800;font-size:17px}
.eq:nth-child(even){background:#f6f9fd}

/* 단 선택 */
.dan-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:18px 0}
.dan-btn{border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 8px;font-weight:900;font-size:17px}
.dan-btn:hover{background:#f7fbff}

/* 객관식 */
.question{display:grid;place-items:center;min-height:350px;text-align:center}
.q{font-weight:1000;font-size:clamp(45px,10vw,80px);letter-spacing:-.04em;margin-bottom:24px}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:min(560px,100%);margin:0 auto}
.choice{
  border:2px solid #dde5f0;background:#fff;border-radius:18px;padding:18px 12px;
  font-size:25px;font-weight:1000;min-height:70px;transition:.15s
}
.choice:hover{border-color:var(--accent);transform:translateY(-2px)}
.choice.correct{background:#eafaf2;border-color:var(--good);color:#158854}
.choice.wrong{background:#fff0f0;border-color:var(--bad);color:#c94444}
.choice:disabled{cursor:default}
.feedback{min-height:35px;margin-top:16px;font-size:20px;font-weight:1000}
.feedback.good{color:var(--good)} .feedback.bad{color:var(--bad)}
.next-btn{border:0;background:var(--accent);color:#fff;border-radius:16px;padding:14px 24px;font-weight:1000;margin-top:12px}
.progress{height:11px;background:#eef2f7;border-radius:99px;overflow:hidden;margin-top:18px}
.bar{height:100%;width:0;background:linear-gradient(90deg,#5aa9ff,#7c79f6);transition:.25s}
.result{text-align:center;padding:20px 0 6px}
.trophy{font-size:64px}.stars{font-size:30px;letter-spacing:5px}
.result h2{font-size:32px;margin:8px 0}.big-score{font-size:46px;font-weight:1000;margin:12px 0}
.result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.primary,.secondary{border:0;border-radius:15px;padding:13px 18px;font-weight:1000}
.primary{background:var(--accent);color:#fff}.secondary{background:#f0f3f8;color:var(--text)}
@media(max-width:700px){
  .wrap{padding-top:18px}.panel{padding:16px;border-radius:20px}
  .stage-grid{grid-template-columns:1fr}.stage{min-height:125px}
  .study-grid{grid-template-columns:1fr 1fr}.dan-grid{grid-template-columns:repeat(3,1fr)}
  .choices{grid-template-columns:1fr 1fr}.game-head{align-items:flex-start}
}
@media(max-width:460px){
  .study-grid{grid-template-columns:1fr}.choice{font-size:22px;padding:15px 10px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="brand">✖️ 구구단 챌린지</div>
      <div class="sub">공부하고, 객관식 게임으로 실력을 확인해요!</div>
    </div>
    <button class="sound" id="soundBtn">🔊</button>
  </div>

  <section class="panel" id="home">
    <div class="stage-grid">
      <button class="stage" data-mode="study9">
        <div class="num">1</div>
        <h3>1단 ~ 9단 공부</h3>
        <p>문제를 풀지 않고 1×1부터 9×9까지 구구단표를 보며 공부해요.</p>
      </button>
      <button class="stage" data-mode="study15">
        <div class="num">2</div>
        <h3>1단 ~ 15단 게임</h3>
        <p>원하는 단을 골라 4개의 보기 중 정답을 선택해요.</p>
      </button>
      <button class="stage" data-mode="random9">
        <div class="num">3</div>
        <h3>1단 ~ 9단 랜덤 게임</h3>
        <p>랜덤 10문제를 객관식으로 풀어요.</p>
      </button>
      <button class="stage" data-mode="random15">
        <div class="num">4</div>
        <h3>1단 ~ 15단 랜덤 게임</h3>
        <p>15단까지 랜덤 15문제! 최종 도전이에요.</p>
      </button>
    </div>
    <div class="footer-note">정답이라고 생각하는 숫자 버튼을 눌러주세요.</div>
  </section>

  <section class="panel hidden" id="study">
    <div class="game-head">
      <button class="back" onclick="goHome()">← 처음으로</button>
      <div class="pill">📚 공부 모드</div>
    </div>
    <div class="title">
      <h2>1단 ~ 9단 구구단표</h2>
      <p>천천히 읽으면서 외워보세요.</p>
    </div>
    <div class="study-grid" id="studyGrid"></div>
  </section>

  <section class="panel hidden" id="selectDan">
    <div class="game-head">
      <button class="back" onclick="goHome()">← 처음으로</button>
      <div class="pill">1단 ~ 15단</div>
    </div>
    <div class="title">
      <h2>게임할 단을 골라요</h2>
      <p>선택한 단의 1배부터 15배까지 객관식으로 풀어요.</p>
    </div>
    <div class="dan-grid" id="danGrid"></div>
  </section>

  <section class="panel hidden" id="game">
    <div class="game-head">
      <button class="back" onclick="goHome()">← 처음으로</button>
      <div class="status">
        <div class="pill">점수 <span id="score">0</span></div>
        <div class="pill">연속 <span id="streak">0</span>🔥</div>
        <div class="pill"><span id="count">1</span>/<span id="total">10</span></div>
      </div>
    </div>
    <div class="title">
      <h2 id="gameTitle">구구단 문제</h2>
      <p>정답이라고 생각하는 숫자를 눌러주세요.</p>
    </div>
    <div class="question">
      <div style="width:100%">
        <div class="q" id="questionText">2 × 3 = ?</div>
        <div class="choices" id="choices"></div>
        <div class="feedback" id="feedback"></div>
      </div>
    </div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="hint">정답 +10점 · 연속 정답 보너스 최대 +10점</div>
  </section>

  <section class="panel hidden" id="result">
    <div class="result">
      <div class="trophy" id="trophy">🏆</div>
      <div class="stars" id="stars">⭐⭐⭐</div>
      <h2>도전 완료!</h2>
      <div class="big-score"><span id="finalScore">0</span>점</div>
      <p id="resultText">정말 잘했어요!</p>
      <div class="result-actions">
        <button class="primary" id="retryBtn">한 번 더</button>
        <button class="secondary" onclick="goHome()">다른 단계</button>
      </div>
    </div>
  </section>
</div>

<script>
let soundOn=true, currentMode=null, selectedDan=null, questions=[], idx=0, score=0, streak=0, answered=false;
const $=s=>document.querySelector(s);
const sections=["home","study","selectDan","game","result"].map(id=>$("#"+id));

function show(el){sections.forEach(x=>x.classList.add("hidden"));el.classList.remove("hidden")}
function goHome(){show($("#home"))}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}

function beep(ok=true){
  if(!soundOn)return;
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);o.type="sine";o.frequency.value=ok?720:220;
    g.gain.setValueAtTime(.12,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.16);
    o.start();o.stop(ctx.currentTime+.16)
  }catch(e){}
}
$("#soundBtn").onclick=()=>{soundOn=!soundOn;$("#soundBtn").textContent=soundOn?"🔊":"🔇"};

document.querySelectorAll(".stage").forEach(b=>b.onclick=()=>startMode(b.dataset.mode));

function startMode(mode){
  currentMode=mode;
  if(mode==="study9"){buildStudy();show($("#study"));return}
  if(mode==="study15"){buildDanButtons();show($("#selectDan"));return}
  selectedDan=null;beginGame()
}

function buildStudy(){
  const grid=$("#studyGrid");grid.innerHTML="";
  for(let d=1;d<=9;d++){
    const card=document.createElement("div");card.className="table-card";
    const h=document.createElement("h3");h.textContent=`${d}단`;card.appendChild(h);
    for(let n=1;n<=9;n++){
      const p=document.createElement("div");p.className="eq";p.textContent=`${d} × ${n} = ${d*n}`;card.appendChild(p)
    }
    grid.appendChild(card)
  }
}
function buildDanButtons(){
  const grid=$("#danGrid");grid.innerHTML="";
  for(let d=1;d<=15;d++){
    const b=document.createElement("button");b.className="dan-btn";b.textContent=`${d}단`;
    b.onclick=()=>{selectedDan=d;beginGame()};grid.appendChild(b)
  }
}
function makeQuestions(){
  const a=[];
  if(currentMode==="study15"){for(let n=1;n<=15;n++)a.push([selectedDan,n])}
  else if(currentMode==="random9"){for(let i=0;i<10;i++)a.push([rand(1,9),rand(1,9)])}
  else if(currentMode==="random15"){for(let i=0;i<15;i++)a.push([rand(1,15),rand(1,15)])}
  return a
}
function beginGame(){
  questions=makeQuestions();idx=0;score=0;streak=0;answered=false;
  $("#score").textContent=0;$("#streak").textContent=0;$("#total").textContent=questions.length;
  $("#gameTitle").textContent=selectedDan?`${selectedDan}단 게임`:(currentMode==="random9"?"1~9단 랜덤 게임":"1~15단 랜덤 게임");
  show($("#game"));renderQuestion()
}
function makeChoices(correct){
  const set=new Set([correct]);
  const spread=correct<=15?6:Math.max(8,Math.round(correct*.22));
  while(set.size<4){
    let v=correct+rand(-spread,spread);
    if(v>0)set.add(v)
  }
  return shuffle([...set])
}
function renderQuestion(){
  answered=false;
  const fb=$("#feedback");
  fb.textContent="";
  fb.className="feedback";

  const [a,b]=questions[idx];
  const correct=a*b;

  $("#questionText").textContent=`${a} × ${b} = ?`;
  $("#count").textContent=idx+1;
  $("#bar").style.width=`${(idx/questions.length)*100}%`;

  const box=$("#choices");
  box.innerHTML="";

  const choiceValues=makeChoices(correct);
  choiceValues.forEach(v=>{
    const btn=document.createElement("button");
    btn.className="choice";
    btn.textContent=v;
    btn.onclick=()=>chooseAnswer(btn,v,correct);
    box.appendChild(btn);
  });
}
function chooseAnswer(btn,value,correct){
  if(answered)return;
  answered=true;

  const buttons=[...document.querySelectorAll(".choice")];
  buttons.forEach(b=>b.disabled=true);
  const fb=$("#feedback");

  if(value===correct){
    streak++;
    const bonus=Math.min(streak-1,5)*2;
    score+=10+bonus;
    btn.classList.add("correct");
    fb.textContent=bonus?`정답! +${10+bonus}점 🔥`:"정답! +10점 🎉";
    fb.className="feedback good";
    beep(true);
  }else{
    streak=0;
    btn.classList.add("wrong");
    buttons.find(b=>Number(b.textContent)===correct)?.classList.add("correct");
    fb.textContent=`아쉬워! 정답은 ${correct}이야.`;
    fb.className="feedback bad";
    beep(false);
  }

  $("#score").textContent=score;
  $("#streak").textContent=streak;
  $("#bar").style.width=`${((idx+1)/questions.length)*100}%`;

  // 정답/오답을 잠깐 보여준 뒤 자동으로 다음 문제로 이동
  setTimeout(()=>{
    if(idx>=questions.length-1){
      finishGame();
    }else{
      idx++;
      renderQuestion();
    }
  }, 1000);
}
function finishGame(){
  const ratio=Math.min(score/(questions.length*10),1);
  $("#stars").textContent=ratio>=.9?"⭐⭐⭐":ratio>=.65?"⭐⭐":"⭐";
  $("#trophy").textContent=ratio>=.9?"🏆":ratio>=.65?"🥈":"🥉";
  $("#resultText").textContent=ratio>=.9?"완벽에 가까워! 구구단 고수!":ratio>=.65?"잘했어! 한 번 더 하면 더 높게 갈 수 있어!":"조금만 더 연습하면 훨씬 빨라질 거야!";
  $("#finalScore").textContent=score;show($("#result"))
}
$("#retryBtn").onclick=()=>beginGame();
</script>
</body>
</html>
